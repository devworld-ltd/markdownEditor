name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # jsdom 30 은 undici 8 을 요구하고, undici 8 의 engines 는 Node >=22.19.0 이다.
          # Node 20 에서는 webidl.util.markAsUncloneable 부재로 단위 테스트가 기동조차 못 한다.
          node-version: 24
          cache: npm

      - run: npm ci

      - name: 타입 검사 + 빌드
        run: npm run build

      - name: 단위 테스트 + 커버리지
        run: npm run test:coverage

      - name: Playwright 브라우저 설치
        run: npx playwright install --with-deps chromium

      - name: E2E 테스트
        run: npm run test:e2e

      - name: 실패 아티팩트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # 검증을 통과한 커밋만 배포한다. deploy 를 별도 워크플로로 두면 테스트 실패와
  # 무관하게 배포가 성사되므로 같은 워크플로의 의존 잡으로 묶었다.
  deploy:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: 빌드
        run: npm run build

      # wrangler-action 이 번들한 wrangler 3.x 는 wrangler.jsonc(JSON 설정)를 읽지 못해
      # env 와 assets 를 통째로 무시한다. package-lock 에 고정된 wrangler 4 를 직접 쓴다.
      - name: Cloudflare Workers 배포
        run: npx wrangler deploy --env ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # F-64(#15): 배포 직후 자동 헬스체크. 캐시 우회 + 재시도 + SHA 일치 확인은
      # scripts/healthcheck.sh 에 위임한다(로컬에서도 동일 스크립트로 수동 재현 가능).
      - name: 배포 헬스체크
        run: |
          URL="${{ github.ref == 'refs/heads/main' && 'https://md-editor.devworld.co.kr' || 'https://md-editor-dev.devworld.co.kr' }}"
          ./scripts/healthcheck.sh "$URL" "${GITHUB_SHA:0:7}"

  # #131: 릴리스 태그 + GitHub Release.
  #
  # **배포와 헬스체크가 끝난 뒤에만** 만든다 — 태그는 "이 버전이 서비스되고 있다"
  # 는 표식이어야 하고, 배포가 실패했는데 태그가 남으면 그 표식이 거짓말을 한다.
  #
  # CI 는 커밋을 되밀지 않는다(main 은 브랜치 보호). 버전 올리기와 CHANGELOG 작성은
  # 승격 PR 안에서 이미 끝나 있고, 여기서는 그 결과를 **읽어서** 태그만 붙인다.
  release:
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 버전 읽기
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # 이미 있으면 조용히 끝낸다. 문서만 고친 배포는 버전이 그대로라 이 경로로 온다 —
      # 실패로 다루면 정상 배포마다 빨간 X 가 뜬다.
      - name: 태그 존재 확인
        id: tag
        run: |
          if git rev-parse "v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v${{ steps.v.outputs.version }} 태그가 이미 있습니다 — 새 릴리스를 만들지 않습니다."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # CHANGELOG 의 해당 버전 절만 잘라 릴리스 본문으로 쓴다.
      # **없으면 실패시킨다** — 빈 릴리스 노트는 없는 것보다 나쁘다(무엇이 바뀌었는지
      # 알려주겠다고 해 놓고 빈 화면을 보여주는 셈이다).
      - name: 릴리스 본문 추출
        if: steps.tag.outputs.exists == 'false'
        run: |
          node scripts/changelog-section.mjs "${{ steps.v.outputs.version }}" > /tmp/notes.md
          echo "--- 릴리스 본문 ---"; cat /tmp/notes.md

      - name: 태그 + GitHub Release 생성
        if: steps.tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="v${{ steps.v.outputs.version }}"
          git tag "$V"
          git push origin "$V"
          gh release create "$V" --title "$V" --notes-file /tmp/notes.md --latest
