<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="설치 없이 브라우저에서 바로 쓰는 마크다운 에디터. 실시간 프리뷰, 멀티 탭, 로컬 파일 열기/저장을 지원합니다."
    />
    <meta name="theme-color" content="#1e1e1e" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <!-- iOS 홈 화면. SVG 를 지원하지 않아 PNG 가 없으면 페이지 스크린샷으로
         대체된다. 알파도 지원하지 않으므로 이 PNG 는 모서리가 둥글지 않은
         full-bleed 다 — iOS 가 자기 마스크를 덧씌운다(F-68). -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Markdown Editor</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="toolbar">
        <h1>Markdown Editor</h1>
        <div id="toolbar-actions" class="toolbar-actions"></div>
      </header>
      <nav id="tab-bar" class="tab-bar" aria-label="열린 문서"></nav>

      <!-- F-22 문서 내 검색. 모달이 아니라 상단 바인 이유: 찾은 위치를 보면서
           이동해야 하므로 본문을 가리면 안 된다. -->
      <div id="search-bar" class="search-bar" role="search" aria-label="문서에서 찾기" data-state="ok" hidden>
        <input
          type="text"
          id="search-input"
          class="search-input"
          placeholder="문서에서 찾기"
          aria-label="문서에서 찾기"
          autocomplete="off"
          spellcheck="false"
        />
        <span id="search-count" class="search-count" role="status" aria-live="polite"></span>
        <button type="button" id="search-prev" class="search-btn" aria-label="이전 결과">&#8593;</button>
        <button type="button" id="search-next" class="search-btn" aria-label="다음 결과">&#8595;</button>
        <button
          type="button"
          id="search-toggle-replace"
          class="search-btn"
          aria-label="치환 열기"
          aria-expanded="false"
          aria-controls="search-replace-row"
        >
          &#8644;
        </button>
        <button type="button" id="search-close" class="search-btn" aria-label="검색 닫기">&times;</button>
      </div>

      <!-- 치환은 찾기보다 훨씬 덜 쓰이므로 기본으로 접어 둔다(F-22 잔여). -->
      <div id="search-replace-row" class="search-bar search-replace-row" role="search" aria-label="찾은 내용 바꾸기" hidden>
        <input
          type="text"
          id="search-replace-input"
          class="search-input"
          placeholder="바꿀 내용"
          aria-label="바꿀 내용"
          autocomplete="off"
          spellcheck="false"
        />
        <button type="button" id="search-replace-one" class="search-text-btn">바꾸기</button>
        <button type="button" id="search-replace-all" class="search-text-btn">모두 바꾸기</button>
      </div>
      <main class="editor-container" data-mode="split">
        <textarea
          id="editor"
          placeholder="마크다운을 입력하세요..."
          spellcheck="false"
          autocomplete="off"
          autocapitalize="off"
          aria-label="마크다운 편집기"
        ></textarea>
        <!-- F-32 분할 비율 조절. role="separator" + tabindex 로 키보드에서도
             도달한다 — 드래그 전용이면 키보드 사용자에게는 없는 기능이다. -->
        <div
          id="split-resizer"
          class="split-resizer"
          role="separator"
          tabindex="0"
          aria-orientation="vertical"
          aria-label="편집 영역과 미리보기 영역의 비율 조절"
          aria-valuemin="15"
          aria-valuemax="85"
          aria-valuenow="50"
        ></div>
        <!-- role 없이 aria-label 은 금지된 조합(aria-prohibited-attr)이다.
             tabindex="0" 은 별도 문제도 함께 고친다 — 그전에는 프리뷰를
             키보드로 스크롤할 방법이 아예 없었다. -->
        <div id="preview" role="region" aria-label="미리보기" tabindex="0"></div>
      </main>
      <!-- F-58: 단축키 안내. 네이티브 <dialog> 를 쓰면 포커스 트랩·Esc 닫기·
           백드롭·바깥 요소 inert 처리를 브라우저가 정확히 해 준다. -->
      <dialog id="shortcut-help" class="shortcut-help" aria-labelledby="shortcut-help-title">
        <div class="shortcut-help-header">
          <h2 id="shortcut-help-title">단축키</h2>
          <button type="button" id="shortcut-help-close" class="shortcut-help-close" aria-label="닫기">
            &times;
          </button>
        </div>
        <div id="shortcut-help-list" class="shortcut-help-list"></div>
      </dialog>

      <div id="notice-stack" class="notice-stack">
        <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>

        <div
          id="fs-limit-notice"
          class="notice fs-limit-notice"
          role="status"
          aria-live="polite"
          hidden
        >
          <p class="sw-update-text">
            이 브라우저에서는 파일을 직접 덮어쓸 수 없어 저장할 때마다 새 파일이
            다운로드 폴더에 추가됩니다.<br />최신 내용은 다운로드 폴더에서
            확인하세요. Chrome·Edge에서는 원본에 바로 저장됩니다.
          </p>
          <div class="sw-update-actions">
            <button type="button" id="fs-limit-notice-dismiss" class="sw-update-btn">
              확인
            </button>
          </div>
        </div>

        <div
          id="sw-update"
          class="notice sw-update"
          role="status"
          aria-live="polite"
          data-state="idle"
          hidden
        >
          <p id="sw-update-text" class="sw-update-text">
            <span id="sw-update-text-idle"
              >새 버전이 준비됐습니다.<br />새로고침하면 최신 버전으로 전환됩니다.</span
            >
            <span id="sw-update-text-updating" hidden>새 버전으로 전환하는 중입니다...</span>
          </p>
          <div class="sw-update-actions">
            <button type="button" id="sw-update-later" class="sw-update-btn">나중에</button>
            <button type="button" id="sw-update-reload" class="sw-update-btn primary">
              새로고침
            </button>
          </div>
        </div>

        <div
          id="offline-indicator"
          class="notice offline-indicator"
          role="status"
          aria-live="polite"
          hidden
        >
          오프라인 상태입니다. 편집·저장은 이 기기에서 계속 동작합니다.
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
